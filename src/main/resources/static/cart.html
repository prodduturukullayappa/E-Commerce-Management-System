<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/index.html"><i class="fas fa-shopping-bag me-2"></i>ShopEase</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="/orders.html">My Orders</a></li>
                </ul>
                <div class="d-flex align-items-center me-3" id="auth-nav-items"></div>
                <a href="/cart.html" class="btn btn-light position-relative">
                    <i class="fas fa-shopping-cart text-primary"></i> Cart
                    <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div id="alert-container"></div>
        <h1 class="h3 fw-bold mb-4">Shopping Cart</h1>

        <div class="row" id="cart-container">
            <!-- Loaded dynamically -->
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 ShopEase E-Commerce System. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        async function loadCart() {
            const customerId = getCustomerId();
            try {
                const res = await fetch(`/api/cart/${customerId}`);
                const items = await res.json();
                const container = document.getElementById('cart-container');

                if (items.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fas fa-shopping-cart fa-3x text-muted mb-3"></i>
                            <h4 class="text-muted">Your cart is empty</h4>
                            <a href="/products.html" class="btn btn-primary mt-3">Start Shopping</a>
                        </div>
                    `;
                    return;
                }

                let subtotal = items.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
                let shipping = subtotal > 0 ? 99.00 : 0.00;
                let total = subtotal + shipping;

                let html = `
                    <div class="col-lg-8">
                        <div class="card p-3 mb-4">
                            <div class="table-responsive">
                                <table class="table align-middle">
                                    <thead>
                                        <tr>
                                            <th>Product</th>
                                            <th>Price</th>
                                            <th>Quantity</th>
                                            <th>Total</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                `;

                items.forEach(item => {
                    html += `
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <img src="${item.product.imageUrl || 'https://via.placeholder.com/50'}" class="rounded me-3" style="width: 50px; height: 50px; object-fit: cover;">
                                    <div>
                                        <h6 class="mb-0 fw-bold">${item.product.name}</h6>
                                    </div>
                                </div>
                            </td>
                            <td>₹${item.product.price.toFixed(2)}</td>
                            <td>
                                <div class="input-group input-group-sm" style="width: 100px;">
                                    <button class="btn btn-outline-secondary" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                                    <input type="text" class="form-control text-center" value="${item.quantity}" readonly>
                                    <button class="btn btn-outline-secondary" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                                </div>
                            </td>
                            <td class="fw-bold">₹${(item.product.price * item.quantity).toFixed(2)}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${item.id})"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });

                html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card p-4">
                            <h4 class="fw-bold mb-3">Order Summary</h4>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal</span>
                                <span>₹${subtotal.toFixed(2)}</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Shipping Fee</span>
                                <span>₹${shipping.toFixed(2)}</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-4">
                                <span class="fw-bold fs-5">Total</span>
                                <span class="fw-bold fs-5 text-primary">₹${total.toFixed(2)}</span>
                            </div>
                            <a href="/checkout.html" class="btn btn-primary w-100 py-2 fw-bold">Proceed to Checkout</a>
                        </div>
                    </div>
                `;

                container.innerHTML = html;
                updateCartCount();
            } catch (err) {
                console.error(err);
            }
        }

        async function updateQuantity(itemId, newQty) {
            if (newQty <= 0) {
                removeItem(itemId);
                return;
            }
            try {
                const res = await fetch('/api/cart/update', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ itemId: itemId, quantity: newQty })
                });
                if (res.ok) {
                    loadCart();
                } else {
                    const errData = await res.json();
                    showAlert(errData.error || 'Failed to update quantity', 'danger');
                }
            } catch (err) {
                showAlert('Error updating quantity', 'danger');
            }
        }

        async function removeItem(itemId) {
            try {
                const res = await fetch(`/api/cart/${itemId}`, { method: 'DELETE' });
                if (res.ok) {
                    showAlert('Item removed from cart');
                    loadCart();
                }
            } catch (err) {
                showAlert('Error removing item', 'danger');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
        });
    </script>
</body>
</html>
