<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Customer Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/index.html"><i class="fas fa-shopping-bag me-2"></i>ShopEase</a>
        </div>
    </nav>

    <!-- Register Container -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div id="alert-container"></div>
                <div class="card shadow-lg p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus fa-4x text-primary mb-2"></i>
                        <h3 class="fw-bold">Create Account</h3>
                        <p class="text-muted">Register with your details to start shopping</p>
                    </div>
                    <form onsubmit="handleCustomerRegister(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" class="form-control" id="reg-name" required placeholder="Rahul Sharma">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" id="reg-email" required placeholder="rahul@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Password</label>
                            <input type="password" class="form-control" id="reg-password" required placeholder="Create a strong password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Phone Number</label>
                            <input type="tel" class="form-control" id="reg-phone" required placeholder="+91 9876543210">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Delivery Address</label>
                            <textarea class="form-control" id="reg-address" rows="2" required placeholder="Door No, Street, City, Pincode"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold fs-5">Register Now</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">Already have an account? <a href="/login.html" class="fw-bold text-primary">Log In Here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        async function handleCustomerRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const phone = document.getElementById('reg-phone').value;
            const address = document.getElementById('reg-address').value;

            try {
                const res = await fetch('/api/customers/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, phone, address, role: 'CUSTOMER' })
                });

                if (res.ok) {
                    const user = await res.json();
                    setCurrentUser(user);
                    showAlert('Account created successfully! Redirecting...', 'success');
                    setTimeout(() => { window.location.href = '/index.html'; }, 1000);
                } else {
                    const err = await res.json();
                    showAlert(err.error || 'Failed to register', 'danger');
                }
            } catch (err) {
                showAlert('Error creating account', 'danger');
            }
        }
    </script>
</body>
</html>
