<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Customer Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/index.html"><i class="fas fa-shopping-bag me-2"></i>ShopEase</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/products.html">Products</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div id="alert-container"></div>
                <div class="card shadow-lg p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-circle fa-4x text-primary mb-2"></i>
                        <h3 class="fw-bold">Customer Login</h3>
                        <p class="text-muted">Sign in to manage orders and checkout seamlessly</p>
                    </div>
                    <form onsubmit="handleCustomerLogin(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="login-email" required placeholder="rahul@example.com">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="login-password" required placeholder="••••••••">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold fs-5">Login</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="mb-1 text-muted">Don't have an account? <a href="/register.html" class="fw-bold text-primary">Register Here</a></p>
                        <p class="mb-0 text-muted">Are you an Admin? <a href="/admin-login.html" class="fw-bold text-dark">Admin Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        async function handleCustomerLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('/api/customers/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    const user = await res.json();
                    setCurrentUser(user);
                    showAlert('Login successful! Redirecting...', 'success');
                    setTimeout(() => { window.location.href = '/index.html'; }, 1000);
                } else {
                    const err = await res.json();
                    showAlert(err.error || 'Invalid email or password', 'danger');
                }
            } catch (err) {
                showAlert('Error logging in', 'danger');
            }
        }
    </script>
</body>
</html>
